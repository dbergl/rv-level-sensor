[platformio]
default_envs = esp32

[env]
lib_ldf_mode = deep+
build_unflags = -std=gnu++11

; Shared by the firmware envs.
[esp32_base]
platform = espressif32@^6
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  ; Ed25519 verification runs in the NimBLE host task (OTA BEGIN); 4096 is the default.
  -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
extra_scripts =
  pre:tools/fw_version.py
  pre:tools/ota_pubkey.py
test_ignore = *

; Leveling sensor and AC bridge.
[env:esp32]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
  ; AC unit + Home Assistant + update client, plus one slot kept free for advertising (BleServer).
  ; NimBLE-Arduino 1.4 also passes this to the controller (ble_max_conn).
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4

; Leveling sensor only (no AC bridge). NimBLE's default 3 links.
[env:esp32_level]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
  -DRVL_AC_BRIDGE=0

; AC bridge only (no leveling sensor).
[env:esp32_ac]
extends = env:esp32
build_flags =
  ${env:esp32.build_flags}
  -DRVL_LEVELING=0

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra

[platformio]
default_envs = esp32

[env]
lib_ldf_mode = deep+
build_unflags = -std=gnu++11

[env:esp32]
platform = espressif32@^6
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
extra_scripts = pre:tools/fw_version.py
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
